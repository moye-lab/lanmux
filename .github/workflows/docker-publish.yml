# LanMux — Build & Publish Docker Image (supply-chain hardened, audit M-46/M-49/M-50)
#
# Provenance contract (M-46): BOTH registries are CI products of this one
# workflow — GHCR (ghcr.io/moye-lab/lanmux) and Docker Hub
# (docker.io/moyelab/lanmux) receive the same build and the same digest.
# Manual image pushes are abolished; see README "镜像来源与验证".
# Publish gate (M-50): the `docker` job runs ONLY on version tags (v*).
# Pushes to main run `test` + `docker-smoke` only and publish nothing.
#
# Verification status: YAML syntax-checked in the sandbox (python yaml).
# There is no Docker daemon in the sandbox, so this workflow has NOT been
# run end-to-end here; the next real CI run must confirm it (see the
# workflow's own comments for the two known ordering caveats).
name: Build & Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub repository name differs from the GitHub repo path
  # (moye-lab/lanmux on GitHub, moyelab/lanmux on Docker Hub).
  DOCKERHUB_IMAGE: moyelab/lanmux

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies from lockfile
        run: pip install --require-hashes -r backend/requirements.lock
      - name: Verify lockfiles are in sync with manifests
        # Dependabot bumps the floor manifests; the lockfiles must be
        # regenerated with pip-compile in the same change. pip-compile has
        # no --check flag, so regenerate to a temp file and diff (skipping
        # the 6-line autogenerated header, which embeds the invoked
        # command and output path).
        run: |
          pip install pip-tools
          pip-compile --generate-hashes --constraint backend/constraints.txt \
              --output-file /tmp/prod.lock.check backend/requirements-prod.txt
          tail -n +7 /tmp/prod.lock.check > /tmp/prod.lock.check.body
          tail -n +7 backend/requirements-prod.lock > /tmp/prod.lock.committed.body
          diff -u /tmp/prod.lock.committed.body /tmp/prod.lock.check.body
          pip-compile --generate-hashes \
              --constraint backend/requirements-prod.lock \
              --constraint backend/constraints.txt \
              --output-file /tmp/dev.lock.check backend/requirements.txt
          tail -n +7 /tmp/dev.lock.check > /tmp/dev.lock.check.body
          tail -n +7 backend/requirements.lock > /tmp/dev.lock.committed.body
          diff -u /tmp/dev.lock.committed.body /tmp/dev.lock.check.body
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-prod.lock
          pip-audit -r backend/requirements.lock
      - name: Run test suite
        working-directory: backend
        run: pytest -q


  docker-smoke:
    name: Docker amd64 cold-start smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build amd64 smoke image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: lanmux:smoke
          build-args: |
            LANMUX_VERSION=1.0.2
            LANMUX_COMMIT=${{ github.sha }}
            LANMUX_BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,mode=max,scope=docker-smoke

      - name: Start cold container
        run: |
          mkdir -p "$RUNNER_TEMP/lanmux-data"
          docker run -d --name lanmux-smoke \
            --network host \
            --user 0:0 \
            -e LANMUX_WEB_PORT=18086 \
            -e LANMUX_SS_PORT=11001 \
            -e LANMUX_MIXED_PORT=17890 \
            -e LANMUX_CONTROLLER_PORT=19090 \
            -e LANMUX_LAN_IP=127.0.0.1 \
            -v "$RUNNER_TEMP/lanmux-data:/data" \
            lanmux:smoke

      - name: Wait for Web + Mihomo
        run: |
          set -eu
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' lanmux-smoke 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              echo "LanMux Docker smoke test passed"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs --tail 100 lanmux-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs --tail 100 lanmux-smoke
          exit 1

      - name: Show runtime diagnostics
        if: always()
        run: |
          docker inspect lanmux-smoke || true
          docker logs --tail 100 lanmux-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f lanmux-smoke || true

  docker:
    name: Build & Push Multi-Arch Image
    # Tag-only publish gate (M-50): main pushes never reach this job, so a
    # docs-only or unreviewed main push can no longer re-publish `latest`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing via GitHub OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (a Docker Hub access
        # token, not a password) must be configured in the repository
        # settings. No credential is stored in this file.
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # Same tags on both registries, same build, same digest (M-46).
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # This job only runs on v* tags, so `latest` is tag-gated too.
            type=raw,value=latest

      - name: Set build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build and push All-in-One image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SBOM (M-50): full build provenance and a
          # software bill of materials are attached to the pushed image.
          provenance: mode=max
          sbom: true
          build-args: |
            LANMUX_VERSION=1.0.2
            LANMUX_COMMIT=${{ github.sha }}
            LANMUX_BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (HIGH/CRITICAL block)
        # NOTE on ordering: a multi-arch image can only be scanned from a
        # registry, so this runs after the push. A HIGH/CRITICAL finding
        # fails the workflow (visible release signal), but the image is
        # already pushed — the next tag must fix it, and the failing run
        # must not be treated as a releasable artifact.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign images with cosign (keyless, GitHub OIDC)
        # Both registries carry the same manifest digest, so one digest
        # signs both. Verify with:
        #   cosign verify --certificate-identity-regexp '.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     ghcr.io/moye-lab/lanmux:1.0.2
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "docker.io/${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}"
